<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julian 💕 Nurlia</title>
  <meta name="description" content="Hadiri acara pernikahan kami pada Minggu, 08 November 2026 Ya!">
  <!-- Open Graph / WhatsApp / Facebook -->
  <meta property="og:title" content="Julian 💕 Nurlia">
  <meta property="og:description" content="Hadiri acara pernikahan kami pada Minggu, 08 November 2026 Ya!">
  <!-- Gambar utama preview WhatsApp (< 150KB, format JPEG 1200x630 agar LANGSUNG muncul seketika) -->
  <meta property="og:image" content="https://kirimdigi.github.io/Julian-Nurlia/Thumbnail.jpg">
  <meta property="og:image:secure_url" content="https://kirimdigi.github.io/Julian-Nurlia/Thumbnail.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Pernikahan Julian & Nurlia">
  <!-- Fallback image -->
  <meta property="og:image" content="https://kirimdigi.github.io/Julian-Nurlia/Foto/6.jpg">
  <link rel="image_src" href="https://kirimdigi.github.io/Julian-Nurlia/Thumbnail.jpg">
  <meta property="og:url" content="https://kirimdigi.github.io/Julian-Nurlia/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Julian & Nurlia Wedding">
  <!-- Twitter / WhatsApp Large Preview -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Julian 💕 Nurlia">
  <meta name="twitter:description" content="Hadiri acara pernikahan kami pada Minggu, 08 November 2026 Ya!">
  <meta name="twitter:image" content="https://kirimdigi.github.io/Julian-Nurlia/Thumbnail.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>

<body>
  <div class="ambient-sparkles" id="ambientSparkles" aria-hidden="true"></div>
  <div class="ambient-petals" id="ambientPetals" aria-hidden="true"></div>

  <audio id="bgMusic" loop preload="auto">
    <source src="rizky-febian-feat-mahalini-bermuara-official-lyric-video_vXgkXk5n.mp3" type="audio/mpeg">
  </audio>

  <div class="music-control" id="musicControl" onclick="toggleMusic()" title="Musik">
    <span id="musicIcon">🎵</span>
  </div>

  <div id="page-wrapper">
    <!-- 1 Cover -->
    <div class="page active" id="page1">
      <div class="page-media">
        <img src="Halaman/1.JPG" alt="Cover - Julian & Nurlia" class="cover-image">
        <button class="open-btn" onclick="openInvitation()">Buka Undangan </button>
      </div>
    </div>

    <!-- 2 Sambutan -->
    <div class="page page-next" id="page2">
      <div class="page-media">
        <img src="Halaman/2.JPG" alt="Sambutan" class="content-image">
      </div>
    </div>

    <!-- 3 Kami yang Menikah -->
    <div class="page page-hidden" id="page3">
      <div class="page-media">
        <img src="Halaman/4.JPG" alt="Kami yang Menikah" class="content-image">
      </div>
    </div>

    <!-- 4 Cerita Kami -->
    <div class="page page-hidden" id="page4">
      <div class="page-media">
        <img src="Halaman/3.JPG" alt="Cerita Kami" class="content-image">
      </div>
    </div>

    <!-- 5 Detail Acara + Maps -->
    <div class="page page-hidden" id="page5">
      <div class="page-media">
        <img src="Halaman/5.JPG" alt="Detail Acara" class="content-image">
        <!-- Hit-area transparan PAS di atas tombol 'Lihat di Google Maps' yang sudah ada di dalam gambar -->
        <a href="https://maps.app.goo.gl/CHao3oKAw6AXfc8W7?g_st=ic" target="_blank" rel="noopener noreferrer" class="maps-hit"
          aria-label="Lihat di Google Maps"></a>
      </div>
    </div>

    <!-- 6 Galeri -->
    <div class="page page-hidden" id="page6">
      <div class="page-media">
        <img src="Halaman/6.JPG" alt="Galeri" class="content-image">
        <!-- Hit areas interaktif: klik foto untuk melihat resolusi penuh -->
        <div class="gallery-hit gallery-hit-1" onclick="openPhotoLightbox('Foto/4.jpg')"
          title="Klik untuk perbesar foto 4" aria-label="Perbesar foto 4"></div>
        <div class="gallery-hit gallery-hit-2" onclick="openPhotoLightbox('Foto/1.jpg')"
          title="Klik untuk perbesar foto 1" aria-label="Perbesar foto 1"></div>
        <div class="gallery-hit gallery-hit-3" onclick="openPhotoLightbox('Foto/5.jpg')"
          title="Klik untuk perbesar foto 5" aria-label="Perbesar foto 5"></div>
        <div class="gallery-hit gallery-hit-4" onclick="openPhotoLightbox('Foto/3.jpg')"
          title="Klik untuk perbesar foto 2" aria-label="Perbesar foto 2"></div>
      </div>
    </div>

    <!-- 7 RSVP & Transfer Cashless -->
    <div class="page page-hidden" id="page7">
      <div class="page-media">
        <img src="Halaman/7.JPG" alt="RSVP & Transfer Cashless" class="content-image">
        <!-- Form Interaktif RSVP & Ucapan ke Spreadsheet -->
        <form class="rsvp-form" id="rsvpForm" onsubmit="submitRsvp(event)">
          <!-- Input Nama -->
          <input type="text" id="rsvpNama" class="rsvp-input rsvp-input-nama" placeholder="Nama" required
            autocomplete="name">

          <!-- Input Ucapan -->
          <textarea id="rsvpUcapan" class="rsvp-input rsvp-input-ucapan" placeholder="Ucapan" rows="2"
            required></textarea>

          <!-- Dropdown Konfirmasi Kehadiran -->
          <select id="rsvpKehadiran" class="rsvp-input rsvp-select-kehadiran" required>
            <option value="" disabled selected hidden>Konfirmasi Kehadiran</option>
            <option value="Hadir">Hadir</option>
            <option value="Tidak Hadir">Tidak Hadir</option>
          </select>

          <!-- Tombol Kirim -->
          <button type="submit" id="btnRsvpKirim" class="rsvp-btn rsvp-btn-kirim" aria-label="Kirim RSVP">
            <span class="btn-text">Kirim</span>
          </button>

          <!-- Tombol Tampilkan Ucapan -->
          <button type="button" id="btnRsvpLihat" class="rsvp-btn rsvp-btn-lihat" onclick="openUcapanModal()"
            aria-label="Tampilkan Ucapan">
            <span class="btn-text">Tampilkan Ucapan</span>
          </button>
        </form>

        <!-- Tombol Salin Rekening SeaBank (Badge di border atas kanan, bebas dari benturan teks) -->
        <div class="bank-box-hit" onclick="copyRekening('901706407987', document.querySelector('.btn-copy-seabank'))"
          style="top: 58.4%;" title="Klik untuk salin nomor rekening SeaBank" aria-hidden="true"></div>
        <button type="button" class="btn-copy-rekening btn-copy-seabank" onclick="copyRekening('901706407987', this)"
          aria-label="Salin nomor rekening SeaBank 901706407987">
          <svg class="copy-svg" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span class="btn-copy-text">Salin</span>
        </button>

        <!-- Tombol Salin Rekening Mandiri (Badge di border atas kanan, bebas dari benturan teks) -->
        <div class="bank-box-hit" onclick="copyRekening('1300022926870', document.querySelector('.btn-copy-mandiri'))"
          style="top: 68.2%;" title="Klik untuk salin nomor rekening Mandiri" aria-hidden="true"></div>
        <button type="button" class="btn-copy-rekening btn-copy-mandiri" onclick="copyRekening('1300022926870', this)"
          aria-label="Salin nomor rekening Mandiri 1300022926870">
          <svg class="copy-svg" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span class="btn-copy-text">Salin</span>
        </button>
      </div>
    </div>

    <!-- 8 Thanks -->
    <div class="page page-hidden" id="page8">
      <div class="page-media">
        <img src="Halaman/8.JPG" alt="Terima Kasih" class="content-image">
        <!-- Hitungan mundur live — overlay di atas angka statis di 8.JPG -->
        <div class="countdown-overlay">
          <div class="cd-box"><span class="num" id="cdDay">00</span><span class="label">Hari</span></div>
          <div class="cd-box"><span class="num" id="cdHour">00</span><span class="label">Jam</span></div>
          <div class="cd-box"><span class="num" id="cdMin">00</span><span class="label">Menit</span></div>
          <div class="cd-box"><span class="num" id="cdSec">00</span><span class="label">Detik</span></div>
        </div>
      </div>
      <footer class="footer-kirimdigi">
        <p class="footer-title">Hubungi Kami Untuk :</p>
        <p class="footer-desc">Aplikasi, CS AI/Chat Bot, Undangan Digital & Website</p>
        <div class="footer-social">
          <a href="https://instagram.com/kirimdigi" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">

                d="M12 2.2c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41a4.5 4.5 0 0 1 1.63 1.06 4.5 4.5 0 0 1 1.06 1.63c.16.43.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23a4.5 4.5 0 0 1-1.06 1.63 4.5 4.5 0 0 1-1.63 1.06c-.43.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41a4.5 4.5 0 0 1-1.63-1.06 4.5 4.5 0 0 1-1.06-1.63c-.16-.43-.36-1.06-.41-2.23C2.21 15.58 2.2 15.2 2.2 12s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23A4.5 4.5 0 0 1 3.74 3.29a4.5 4.5 0 0 1 1.63-1.06c.43-.16 1.06-.36 2.23-.41C8.87 2.21 9.25 2.2 12 2.2m0 1.8c-3.15 0-3.52.01-4.76.07-1.05.05-1.62.22-2 .37a3 3 0 0 0-1.08.71 3 3 0 0 0-.71 1.08c-.15.38-.32.95-.37 2-.06 1.24-.07 1.61-.07 4.76s.01 3.52.07 4.76c.05 1.05.22 1.62.37 2a3 3 0 0 0 .71 1.08 3 3 0 0 0 1.08.71c.38.15.95.32 2 .37 1.24.06 1.61.07 4.76.07s3.52-.01 4.76-.07c1.05-.05 1.62-.22 2-.37a3 3 0 0 0 1.08-.71 3 3 0 0 0 .71-1.08c.15-.38.32-.95.37-2 .06-1.24.07-1.61.07-4.76s-.01-3.52-.07-4.76c-.05-1.05-.22-1.62-.37-2a3 3 0 0 0-.71-1.08 3 3 0 0 0-1.08-.71c-.38-.15-.95-.32-2-.37-1.24-.06-1.61-.07-4.76-.07zm0 3.86a5.14 5.14 0 1 1 0 10.28 5.14 5.14 0 0 1 0-10.28zm0 1.8a3.34 3.34 0 1 0 0 6.68 3.34 3.34 0 0 0 0-6.68zm6.23-2.15a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z" />
            </svg>
          </a>
          <a href="https://wa.me/6281380989932" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path
                d="M12.04 2a10 10 0 0 0-8.6 15.08L2 22l5.08-1.34A10 10 0 1 0 12.04 2zm0 1.8a8.2 8.2 0 0 1 7.03 12.35l-.43.69-.75-.39a6.6 6.6 0 0 0-3.2-.83c-3.64 0-6.6 2.96-6.6 6.6v.2l-.4.75-.69-.43A8.2 8.2 0 0 1 12.04 3.8zm-2.15 3.9c-.16 0-.42.06-.64.29-.22.23-.85.83-.85 2.02 0 1.19.87 2.34.99 2.5.12.16 1.71 2.62 4.14 3.67.57.25 1.02.4 1.37.51.57.18 1.09.15 1.5.1.46-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1.02-.38-1.94-1.2-.72-.64-1.2-1.43-1.34-1.67-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.2-.47-.39-.41-.54-.41h-.46z" />
            </svg>
          </a>
          <a href="https://tiktok.com/@kirimdigi" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path
                d="M16.6 3a5.7 5.7 0 0 0 1.5 2.7A5.7 5.7 0 0 0 20.8 7V10a8.7 8.7 0 0 1-3.2-.73 8.2 8.2 0 0 1-1.6-.9v6.9a6.1 6.1 0 1 1-6.1-6.1c.37 0 .73.04 1.07.1V12a2.95 2.95 0 1 0 2.95 2.95V3h2.5z" />
            </svg>
          </a>
        </div>
      </footer>
    </div>
  </div>

  <!-- Indikator Dots Halaman (Transisi Dinamis & Interaktif) -->
  <nav class="page-dots-indicator" id="pageDotsIndicator" aria-label="Indikator Halaman">
    <button type="button" class="dot-btn active" onclick="goToPage(0)" aria-label="Halaman 1 (Cover)"></button>
    <button type="button" class="dot-btn" onclick="goToPage(1)" aria-label="Halaman 2 (Sambutan)"></button>
    <button type="button" class="dot-btn" onclick="goToPage(2)" aria-label="Halaman 3 (Kami yang Menikah)"></button>
    <button type="button" class="dot-btn" onclick="goToPage(3)" aria-label="Halaman 4 (Cerita Kami)"></button>
    <button type="button" class="dot-btn" onclick="goToPage(4)" aria-label="Halaman 5 (Detail Acara & Maps)"></button>
    <button type="button" class="dot-btn" onclick="goToPage(5)" aria-label="Halaman 6 (Galeri Foto)"></button>
    <button type="button" class="dot-btn" onclick="goToPage(6)" aria-label="Halaman 7 (RSVP & Transfer)"></button>
    <button type="button" class="dot-btn" onclick="goToPage(7)" aria-label="Halaman 8 (Terima Kasih)"></button>
  </nav>

  <button class="nav-btn nav-prev" onclick="prevPage()" aria-label="Halaman sebelumnya">&#8249;</button>
  <button class="nav-btn nav-next" onclick="nextPage()" aria-label="Halaman selanjutnya">&#8250;</button>

  <!-- Toast Notifikasi (Salin Rekening / RSVP) -->
  <div class="copy-toast" id="copyToast" role="alert" aria-live="assertive"></div>

  <!-- Modal Tampilkan Ucapan & Doa -->
  <div class="ucapan-modal-overlay" id="ucapanModalOverlay" onclick="closeUcapanModal(event)" aria-hidden="true">
    <div class="ucapan-modal-content" onclick="event.stopPropagation()">
      <div class="ucapan-modal-header">
        <div class="ucapan-modal-title">
          <span class="icon">💌</span>
          <h3>Ucapan & Doa Mempelai</h3>
        </div>
        <button type="button" class="btn-close-modal" onclick="closeUcapanModal()" aria-label="Tutup">&times;</button>
      </div>

      <!-- Rekap Jumlah Hadir & Tidak Hadir -->
      <div class="ucapan-stats-bar" id="ucapanStatsBar">
        <div class="stat-pill stat-hadir">
          <span class="stat-icon">✓</span>
          <span class="stat-label">Hadir:</span>
          <span class="stat-count" id="statCountHadir">0</span>
        </div>
        <div class="stat-pill stat-tidak-hadir">
          <span class="stat-icon">✕</span>
          <span class="stat-label">Tidak Hadir:</span>
          <span class="stat-count" id="statCountTidakHadir">0</span>
        </div>
      </div>

      <div class="ucapan-list-container" id="ucapanListContainer">
        <!-- List ucapan dimuat di sini -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
